<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nubia Tomita</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0a1020;
      --card: rgba(15, 23, 42, 0.65);
      --border: rgba(255,255,255,0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --btn: #1b2d5c;
      --btn-hover: #1e40af;
      --tag-bg: rgba(255,255,255,0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: radial-gradient(1200px 600px at 20% 0%, #111827, var(--bg));
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }

    .wrapper { max-width: 960px; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .lang-toggle button {
      background: rgba(30, 64, 175, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .lang-toggle button:hover {
      background: rgba(30, 64, 175, 0.6);
      transform: translateY(-2px);
    }

    .lang-toggle button.active {
      background: rgba(30, 64, 175, 0.85);
      border-color: white;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)), var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.55);
      text-align: center;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .location {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px 0; }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .tag {
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 28px;
      justify-items: center;
    }

    .action {
      padding: 16px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)), var(--btn);
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: transform 0.15s ease, background 0.15s ease;
      width: 200px;
      text-align: center;
    }

    .action span {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      font-weight: 400;
      margin-top: 2px;
    }

    .action:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 26px 0 10px;
      text-align: center;
    }

    .projects { text-align: center; }

    .project-btn {
      background: rgba(30,64,175,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 10px 18px;
      border-radius: 12px;
      margin: 6px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .project-btn:hover {
      background: rgba(30,64,175,0.6);
      transform: translateY(-1px);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      backdrop-filter: blur(8px);
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background-color: #0f172a;
      padding: 24px;
      border-radius: 16px 16px 0 0;
      width: 90%;
      max-width: 800px;
      max-height: 80%;
      overflow-y: auto;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 28px;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      h1 { font-size: 34px; }
      .actions { grid-template-columns: repeat(2, 1fr); }
      .card { padding: 36px; }
    }
  </style>
</head>

<body>
<div class="wrapper">

<div class="topbar">
  <div class="lang-toggle">
    <button id="btn-en" class="active" onclick="setLang('en')">🇺🇸 EN</button>
    <button id="btn-fr" onclick="setLang('fr')">🇫🇷 FR</button>
  </div>
</div>

<div class="card">
  <img src="Nubia_picture.jpg" class="profile-pic" />
  <div class="location">Paris</div>
  <h1>Nubia Tomita</h1>

  <div class="subtitle"
    data-en="Consulting · SaaS · Digital Transformation · Data Analysis"
    data-fr="Conseil · SaaS · Transformation digitale · Analyse de données">
  </div>

  <div class="tags">
    <div class="tag">SaaS</div>
    <div class="tag">Customer Success</div>
    <div class="tag">Change Management</div>
    <div class="tag">Data & Ops</div>
    <div class="tag">AI-enabled products</div>
  </div>

  <div class="actions">
    <a class="action" href="https://www.linkedin.com/in/missnubia" target="_blank">🔗 LinkedIn</a>
    <a class="action" href="mailto:nubiatomita@gmail.com">✉️ Email</a>
    <a class="action" id="cv-button" href="CV_EN.docx.pdf" target="_blank">📄 CV</a>
    <a class="action" href="https://wa.me/330652400841" target="_blank">💬 WhatsApp</a>
  </div>
</div>

<div class="section-title" data-en="Experience" data-fr="Expérience"></div>
<div class="projects">
  <button class="project-btn" data-project="pelico">Pelico · Customer Operations</button>
  <button class="project-btn" data-project="brasa">BRASA · Marketing Ops</button>
  <button class="project-btn" data-project="pepsico">PepsiCo · Logistics</button>
  <button class="project-btn" data-project="btg">BTG Pactual · Finance</button>
</div>

<div class="section-title" data-en="Projects" data-fr="Projets"></div>
<div class="projects">
  <button class="project-btn" data-project="safran">Safran Supply Chain</button>
  <button class="project-btn" data-project="arena">Industry 4.0 Simulation</button>
  <button class="project-btn" data-project="iypt">IYPT Leadership</button>
</div>

<div id="project-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <div id="modal-text"></div>
  </div>
</div>

<script>
const projects = {
  pelico:{en:`<h2>Pelico</h2><ul><li>Led SaaS onboarding for industrial clients</li><li>Built KPIs & dashboards</li></ul>`,
          fr:`<h2>Pelico</h2><ul><li>Onboarding clients industriels SaaS</li><li>Création de KPIs</li></ul>`},
  brasa:{en:`<h2>BRASA</h2><ul><li>Global marketing ops</li></ul>`,
         fr:`<h2>BRASA</h2><ul><li>Marketing opérations globales</li></ul>`},
  pepsico:{en:`<h2>PepsiCo</h2><p>SQL & logistics analysis</p>`,
           fr:`<h2>PepsiCo</h2><p>Analyse logistique SQL</p>`},
  btg:{en:`<h2>BTG Pactual</h2><p>Investment banking analysis</p>`,
       fr:`<h2>BTG Pactual</h2><p>Analyse finance</p>`},
  safran:{en:`<h2>Safran</h2><p>Supply chain optimization</p>`,
          fr:`<h2>Safran</h2><p>Optimisation supply chain</p>`},
  arena:{en:`<h2>Arena Simulation</h2><p>Industry 4.0 factory</p>`,
         fr:`<h2>Arena</h2><p>Simulation usine 4.0</p>`},
  iypt:{en:`<h2>IYPT</h2><p>Team leadership & physics research</p>`,
        fr:`<h2>IYPT</h2><p>Leadership scientifique</p>`}
};

const modal=document.getElementById("project-modal");
const modalText=document.getElementById("modal-text");
document.querySelectorAll(".project-btn").forEach(btn=>{
  btn.onclick=()=>{
    modalText.innerHTML=projects[btn.dataset.project].en;
    modal.style.display="block";
  };
});
document.querySelector(".close-btn").onclick=()=>modal.style.display="none";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none";}
</script>

</div>
</body>
</html>
